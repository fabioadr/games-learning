<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vila de Pedravento</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Sans:wght@400;500&display=swap">
<style>
  /* Layout: uma única coluna, a tela do jogo numa moldura de console, controles logo abaixo. */
  :root {
    --fundo: #0b0f24;          /* sala escura */
    --moldura: #1a2050;        /* plástico do console */
    --janela-a: #3048b8;       /* azul das janelas de FF */
    --janela-b: #0c1660;
    --borda: #e8e8f0;
    --texto: #dfe3f5;
    --texto-suave: #8f97c4;
    --ouro: #f2d36b;
    --f-display: 'Pixelify Sans', 'Courier New', monospace;
    --f-corpo: 'IBM Plex Sans', system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { background: var(--fundo); color: var(--texto); }
  body {
    font-family: var(--f-corpo);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 20px 28px;
  }
  .palco { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font-family: var(--f-display); font-weight: 700; font-size: 1.6rem; margin: 0; letter-spacing: 0.02em; color: var(--ouro); text-wrap: balance; }
  .sub { font-size: 0.85rem; color: var(--texto-suave); }

  .moldura {
    background: var(--moldura);
    border-radius: 10px;
    padding: 10px;
    box-shadow: inset 0 0 0 2px #262e6a, 0 10px 30px rgba(0,0,0,0.5);
  }
  canvas {
    display: block; width: 100%; height: auto;
    image-rendering: pixelated;
    background: #000;
    border-radius: 3px;
  }

  .controles { display: flex; justify-content: space-between; align-items: center; gap: 16px; user-select: none; -webkit-user-select: none; }
  .dpad { display: grid; grid-template-columns: repeat(3, 56px); grid-template-rows: repeat(3, 56px); gap: 2px; }
  .botao {
    touch-action: none;
    border: 1.5px solid var(--borda);
    color: var(--texto);
    background: linear-gradient(var(--janela-a), var(--janela-b));
    font-family: var(--f-display);
    font-size: 1.1rem;
    display: grid; place-items: center;
    cursor: pointer;
    border-radius: 6px;
  }
  .botao:active { filter: brightness(1.35); }
  .botao:focus-visible { outline: 2px solid var(--ouro); outline-offset: 2px; }
  .cima { grid-area: 1 / 2; } .esq { grid-area: 2 / 1; } .dir { grid-area: 2 / 3; } .baixo { grid-area: 3 / 2; }
  .acao { width: 84px; height: 84px; border-radius: 50%; font-size: 1.5rem; color: var(--ouro); }

  .dicas { font-size: 0.85rem; color: var(--texto-suave); line-height: 1.55; margin: 0; }
  kbd { font-family: var(--f-display); color: var(--texto); border: 1px solid var(--texto-suave); border-radius: 3px; padding: 0 5px; }
  @media (prefers-reduced-motion: reduce) { .botao:active { filter: none; } }
</style>
</head>
<body>
<main class="palco">
  <header>
    <h1>Vila de Pedravento</h1>
    <span class="sub">Motor de RPG 16-bit em TypeScript, sem engine</span>
  </header>

  <div class="moldura"><canvas id="tela" aria-label="Tela do jogo"></canvas></div>

  <div class="controles">
    <div class="dpad">
      <button class="botao cima" data-dir="cima" aria-label="Cima">▲</button>
      <button class="botao esq" data-dir="esquerda" aria-label="Esquerda">◀</button>
      <button class="botao dir" data-dir="direita" aria-label="Direita">▶</button>
      <button class="botao baixo" data-dir="baixo" aria-label="Baixo">▼</button>
    </div>
    <button class="botao acao" data-acao aria-label="Ação">A</button>
  </div>

  <p class="dicas">Teclado: <kbd>setas</kbd> ou <kbd>WASD</kbd> para andar, <kbd>Espaço</kbd> ou <kbd>Z</kbd> para falar e interagir.
  Saia de casa, converse com o Ancião, ache o baú e volte a falar com ele: a fala muda porque o mundo guardou uma flag.</p>
</main>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
